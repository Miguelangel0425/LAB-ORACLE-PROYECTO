<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de usuario - Sistema de Gestión Empresarial</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="center-screen">
    <div class="auth-card">
        <h1>Crear cuenta</h1>
        <p class="subtitle">Registro de nuevo usuario</p>

        <form id="formRegister">
            <label for="nombreCompleto">Nombre completo</label>
            <input type="text" id="nombreCompleto" name="nombreCompleto" required autofocus>

            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" minlength="6" required>

            <label for="password2">Confirmar contraseña</label>
            <input type="password" id="password2" name="password2" minlength="6" required>

            <button type="submit" class="btn-primary">Registrarme</button>
        </form>

        <div id="mensaje"></div>

        <div class="link-row">
            &iquest;Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </div>
    </div>
</div>

<script src="js/register.js"></script>
</body>
</html>
